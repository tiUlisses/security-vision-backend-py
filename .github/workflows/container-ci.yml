name: container-ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'docker/**'
      - 'requirements.txt'
      - '.github/workflows/container-ci.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'docker/**'
      - 'requirements.txt'
      - '.github/workflows/container-ci.yml'

jobs:
  build-containers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose syntax
        run: docker compose -f docker-compose.yml config > /tmp/compose.rendered.yml

      - name: Build production image
        run: docker build --target prod -t securityvision-backend:ci-prod .

      - name: Build development image
        run: docker build --target dev -t securityvision-backend:ci-dev .

      - name: Smoke test prod image
        run: |
          docker run --rm \
            -e DB_WAIT=0 \
            -e RUN_MIGRATIONS=0 \
            securityvision-backend:ci-prod \
            python -c "import app.main; print('app import ok')"
