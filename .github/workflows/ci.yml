name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rtls
          POSTGRES_PASSWORD: rtls123
          POSTGRES_DB: rtls_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rtls -d rtls_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://rtls:rtls123@127.0.0.1:5432/rtls_db
      RTLS_MQTT_ENABLED: "false"
      CAMBUS_MQTT_ENABLED: "false"
      ACCESS_CONTROL_MQTT_ENABLED: "false"
      PRESENCE_ROLLUP_ENABLED: "false"
      RUN_MIGRATIONS: "0"
      PYTEST_ASYNCIO_MODE: "auto"
      PYTEST_ASYNCIO_DEFAULT_FIXTURE_LOOP_SCOPE: "session"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f poetry.lock ] || [ -f pyproject.toml ]; then
            pip install poetry
            poetry export --without-hashes -f requirements.txt -o /tmp/requirements.txt
            pip install -r /tmp/requirements.txt
          else
            echo "No supported dependency file found" && exit 1
          fi

      - name: Run ruff (if configured)
        run: |
          if [ -f ruff.toml ] || ([ -f pyproject.toml ] && grep -q "\[tool\.ruff\]" pyproject.toml); then
            pip install ruff
            ruff check .
          else
            echo "ruff not configured, skipping"
          fi

      - name: Run flake8 (if configured)
        run: |
          if [ -f .flake8 ] || [ -f setup.cfg ] || ([ -f pyproject.toml ] && grep -q "\[flake8\]" pyproject.toml); then
            pip install flake8
            flake8 .
          else
            echo "flake8 not configured, skipping"
          fi

      - name: Run black check (if configured)
        run: |
          if [ -f pyproject.toml ] && grep -q "\[tool\.black\]" pyproject.toml; then
            pip install black
            black --check .
          else
            echo "black not configured, skipping"
          fi

      - name: Run mypy (if configured)
        run: |
          if [ -f mypy.ini ] || [ -f .mypy.ini ] || [ -f setup.cfg ] || ([ -f pyproject.toml ] && grep -q "\[tool\.mypy\]" pyproject.toml); then
            pip install mypy
            mypy app
          else
            echo "mypy not configured, skipping"
          fi

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: |
          if [ -d testes ] || [ -d tests ]; then
            pytest -q
          else
            echo "No tests directory found, skipping pytest"
          fi

  docker:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and (optionally) push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
